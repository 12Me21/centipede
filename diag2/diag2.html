<!doctype html>
<meta charset=utf-8>

<svg id=$out viewBox="0 0 300 500" width=300 height=500>
	
</svg>

<script>
	"use strict"
	let def = [
		{
			type: 'arrow1',
			pos: [6, 6],
			size: [1, 4],
			labels: [],
			slice: {n:8, d:1},
		},
		{
			type: 'cloud',
			pos: [6, 6],
			size: [9, 4],
			labels: [
				{pos:"c", text:"layer-specific\nrendering"},
			],
			slice: {n:8, d:1},
		},
		{
			type: 'arrow1',
			pos: [6, 11],
			size: [1, 3],
			labels: [],
			slice: {n:8, d:1},
		},
		{
			type: 'arrow1',
			pos: [6, 15],
			size: [1, 3],
			labels: [],
			slice: {n:8, d:1},
		},
		{
			type: 'arrow1',
			pos: [6, 19.5],
			size: [1, 3],
			labels: [],
			slice: {n:2, d:3},
		},
		{
			type: 'arrow1',
			pos: [6, 23.5],
			size: [1, 3],
			labels: [],
			slice: {n:2, d:3},
		},
		{
			type: 'arrow1',
			pos: [6, 27.5],
			size: [1, 3],
			labels: [],
			slice: {n:2, d:3},
		},
		{
			type: 'arrow1',
			pos: [6, 32],
			size: [1, 3.5],
			labels: [],
		},
		{
			type: 'box',
			pos: [6, 11],
			size: [6, 2],
			labels: [
				{pos:"c", text:"mosaic"},
			],
			slice: {n:8, d:1},
		},
		
		{
			type: 'box',
			pos: [6, 15],
			size: [6, 2],
			labels: [
				{pos:"c", text:"clipping"},
			],
			slice: {n:8, d:1},
		},
		
		{
			type: 'merge1',
			pos: [6, 19.5, -1],
			size: [6, 3],
			labels: [
				{pos:"c", text:"priority\ntable"},
			],
			slice: {n:16, d:0.5},
		},
		{
			type: 'box',
			pos: [6, 23.5],
			size: [8, 2],
			labels: [
				{pos:"c", text:"alpha lookup"},
			],
			slice: {n:2, d:3},
		},
		{
			type: 'box',
			pos: [6, 27.5],
			size: [8, 2],
			labels: [
				{pos:"c", text:"color lookup"},
			],
			slice: {n:2, d:3},
		},
		{
			type: 'merge1',
			pos: [6, 32],
			size: [6, 3],
			labels: [
				{pos:"c", text:"blending"},
			],
			slice: {n:6, d:0.5},
		},
		{
			type: 'oval',
			pos: [6, 37],
			size: [6, 3],
			labels: [
				{pos:"c", text:"display"},
			],
		},
	]
	let margin = 2
	function tt(x,y) {
		return ` transform="translate(${x},${y})"`
	}
	function px(z) {
		return z*2
	}
	function py(z) {
		return z
	}
	function makeshape(x) {
		let xml = ""
		if (x.type=='box') {
			xml += `<path class="box" d="M${-x.size[0]/2*g},${-x.size[1]/2*g} h${x.size[0]*g} v${x.size[1]*g} h${-x.size[0]*g} z"/>`
		} else if (x.type=='cloud') {
			xml += `<path class="box" d="M${(-x.size[0]/2+0.5)*g},${(-x.size[1]/2+1)*g}`
			xml += `a ${g/2},${g/2} 0 11 ${g/2},${-g/2}`
			for (let i=0; i<x.size[0]-2; i++)
				xml += `a ${g/2},${g/2} 0 01 ${g},${0}`
			xml += `a ${g/2},${g/2} 0 11 ${g/2},${g/2}`
			for (let i=0; i<x.size[1]-2; i++)
				xml += `a ${g/2},${g/2} 0 01 ${0},${g}`
			xml += `a ${g/2},${g/2} 0 11 ${-g/2},${g/2}`
			for (let i=0; i<x.size[0]-2; i++)
				xml += `a ${g/2},${g/2} 0 01 ${-g},${0}`
			xml += `a ${g/2},${g/2} 0 11 ${-g/2},${-g/2}`
			for (let i=0; i<x.size[1]-2; i++)
				xml += `a ${g/2},${g/2} 0 01 ${0},${-g}`
			xml += `z"/>`
		} else if (x.type=='arrow1') {
			xml += `<path class="box" d="M${(-x.size[0]/2)*g},${(0)*g}`
			xml += `h${x.size[0]*g} v${(x.size[1]-0.5)*g} l${(-x.size[0]/2)*g},${g/2} l${(-x.size[0]/2)*g},${-g/2}`
			xml += `z"/>`
		} else if (x.type=='merge1') {
			// todo: allow this to be 3d with a thickness parameter  make a shared projection function to map z to x,y
			xml += `<path class="box" d="M${-x.size[0]/2*g},${-x.size[1]/2*g} h${x.size[0]*g} l${-g},${x.size[1]*g} h${-(x.size[0]-2)*g} z"/>`
		} else if (x.type=='oval') {
			xml += `<path class="box" d="M${-x.size[0]/2*g},${0} a ${x.size[0]/2*g},${x.size[1]/2*g} 0 01 ${x.size[0]*g},${0} a ${x.size[0]/2*g},${x.size[1]/2*g} 0 01 ${-x.size[0]*g},${0} z"/>`
		}
		return xml
	}
	function makelabel(parent, l) {
		let pos = {px:0,py:0,ax:0,ay:0}
		if (/n/.test(l.pos)) pos.py = -1
		if (/s/.test(l.pos)) pos.py = 1
		if (/w/.test(l.pos)) pos.px = -1
		if (/e/.test(l.pos)) pos.px = 1
		if (/o/.test(l.pos)) {
			pos.ax = pos.px
			pos.ay = pos.py
		} else {
			pos.ax = -pos.px
			pos.ay = -pos.py
		}
		let xml = "<text"
		xml += tt((pos.px*parent.size[0]/2*g)+pos.ax*margin,(pos.py*parent.size[1]/2*g)+pos.ay*margin)
		xml += ` text-anchor="${["end","middle","start"][pos.ax+1]}"`
		xml += ` dominant-baseline="${["auto","central","hanging"][pos.ay+1]}"`
		xml += `>`
		let lines = l.text.split("\n")
		for (let i=0; i<lines.length; i++) {
			xml += `<tspan x="0" y="${i - (lines.length-1)/2}em">${lines[i]}</tspan>`
		}
		xml += `</text>`
		return xml
	}
	let xml = `<style>
.box {
fill: white;
stroke: black;
stroke-width: 1;
}
tspan:not([dominant-baseline]) { dominant-baseline: inherit; } /* safari... */
</style>`
	let g = 12
	let depths = {} // smaller index = deeper into screen
	function p2depth(d, xml) {
		depths[d] ||= []
		depths[d].push(xml)
	}
	for (let x of def) {
		let cx = x.pos[0]*g+0.5 // todo: do pixel alignment in the shape constructor instead of offsetting everything
		let cy = x.pos[1]*g+0.5
		let shape = makeshape(x)
		if (!x.slice) {
			let z = x.pos[2]
			p2depth(10 + z, `<g ${tt(cx+px(z),cy+py(z))}>${shape}</g>`)
		} else {
			for (let i=x.slice.n-1; i>=0; i--) {
				let z = x.pos[2]+i*x.slice.d
				p2depth(10-z, `<g ${tt(cx+px(z),cy+py(z))}>${shape}</g>`)
			}
		}
		for (let l of x.labels) {
			p2depth(15, `<g ${tt(cx,cy)}>${makelabel(x, l)}</g>`)
		}
	}
	for (let x of Object.keys(depths).sort((a,b)=>a-b)) {
		xml += depths[x].join("")
	}
	$out.innerHTML = xml
</script>
