<!doctype html>
<meta charset=utf-8>

<svg id=$out viewBox="0 0 100 200" width=100 height=200>
	
</svg>

<script>
	let def = [
		{
			type: 'box',
			pos: [4, 6],
			size: [3, 5],
			labels: [
				{pos:"nw", text:"test"},
				{pos:"onw", text:"test"},
			],
		}
	]
	function makelabel(parent, l) {
		let attr = ""
		if (l.pos=="c" || l.pos=="w" || l.pos=="e") {
			attr += `y="0" dominant-baseline="central"`
		} else if (l.pos=="n" || l.pos=="nw" || l.pos=="ne") {
			attr += `y="${-parent.size[1]/2*g}" dominant-baseline="hanging"`
		} else if (l.pos=="s" || l.pos=="sw" || l.pos=="se") {
			attr += `y="${parent.size[1]/2*g}" dominant-baseline="auto"`
		}
		if (l.pos=="c" || l.pos=="n" || l.pos=="s") {
			attr += ` x="0" text-anchor="middle"`
		} else if (l.pos=="w" || l.pos=="nw" || l.pos=="sw") {
			attr += ` x="${-parent.size[0]/2*g}" text-anchor="start"`
		} else if (l.pos=="e" || l.pos=="ne" || l.pos=="se") {
			attr += ` x="${parent.size[0]/2*g}" text-anchor="end"`
		}
		return `<text ${attr}>${l.text}</text>`		
	}
	let xml = `<style>
.box {
fill: white;
stroke: black;
stroke-width: 1;
}
</style>`
	let g = 12
	for (let x of def) {
		xml += `<g transform="matrix(1,0,0,1,${x.pos[0]*g+0.5},${x.pos[1]*g+0.5})">`
		xml += `<path d="M${-x.size[0]/2*g},${-x.size[1]/2*g} h${x.size[0]*g} v${x.size[1]*g} h${-x.size[0]*g} z" class="box"/>`
		for (let l of x.labels) {
			xml += makelabel(x, l)
		}
		xml += `</g>`
	}
	$out.innerHTML = xml
</script>
