<!doctype html>
<meta charset=utf-8>

<svg id=$out viewBox="0 0 300 500" width=300 height=500>
	
</svg>

<script>
	"use strict"
	let def = [
		{
			type: 'arrow1',
			pos: [32, 12],
			size: [2, 8],
			labels: [],
			slice: {n:8, d:1},
		},
		{
			type: 'cloud',
			pos: [32, 12],
			size: [18, 8],
			labels: [
				{pos:"c", text:"layer-specific\nrendering"},
			],
			slice: {n:8, d:1},
		},
		{
			type: 'arrow1',
			pos: [32, 22],
			size: [2, 6],
			labels: [],
			slice: {n:8, d:1},
		},
		{
			type: 'arrow1',
			pos: [32, 30],
			size: [2, 6],
			labels: [],
			slice: {n:8, d:1},
		},
		{
			type: 'arrow1',
			pos: [32, 40],
			size: [2, 6],
			labels: [],
			slice: {n:2, d:3},
		},
		{
			type: 'arrow1',
			pos: [32, 48],
			size: [2, 6],
			labels: [],
			slice: {n:2, d:3},
		},
		{
			type: 'arrow1',
			pos: [32, 56],
			size: [2, 6],
			labels: [],
			slice: {n:2, d:3},
		},
		{
			type: 'arrow1',
			pos: [32, 65],
			size: [2, 7.0],
			labels: [],
		},
		{
			type: 'arrow2',
			pos: [12, 22],
			size: [10, 0],
			labels: [],
			slice: {n:8, d:1},
		},
		{
			type: 'box',
			pos: [32, 22],
			size: [12, 4],
			labels: [
				{pos:"c", text:"mosaic"},
			],
			slice: {n:8, d:1},
		},
		{
			type: 'box',
			pos: [12, 22],
			size: [10, 6],
			labels: [
				{pos:"c", text:"mosaic\nsettings"},
			],
			slice: {n:8, d:1},
		},
		{
			type: 'box',
			pos: [12, 30],
			size: [10, 6],
			labels: [
				{pos:"c", text:"clip\nsettings"},
			],
			slice: {n:8, d:1},
		},
		
		{
			type: 'box',
			pos: [32, 30],
			size: [12, 4],
			labels: [
				{pos:"c", text:"clipping"},
			],
			slice: {n:8, d:1},
		},
		
		{
			type: 'merge1',
			pos: [32, 39.0],
			size: [12, 6],
			labels: [
				{pos:"c", text:"priority\ntable"},
			],
			thickness: 10,
			slice: {n:10, d:1, solid:true},
		},
		{
			type: 'box',
			pos: [32, 48],
			size: [16, 4],
			labels: [
				{pos:"c", text:"alpha lookup"},
			],
			slice: {n:2, d:3},
		},
		{
			type: 'box',
			pos: [32, 56],
			size: [16, 4],
			labels: [
				{pos:"c", text:"color lookup"},
			],
			slice: {n:2, d:3},
		},
		{
			type: 'merge1',
			pos: [32, 65],
			size: [12, 6],
			labels: [
				{pos:"c", text:"blending"},
			],
			thickness: 6,
			slice: {n:6, d:1},
		},
		{
			type: 'oval',
			pos: [32, 75],
			size: [12, 6],
			labels: [
				{pos:"c", text:"display"},
			],
		},
	]
	let margin = 2
	function tt(x,y) {
		return ` transform="translate(${x},${y})"`
	}
	function px(z) {
		return z*2
	}
	function py(z) {
		return z
	}
	function makeshape(x, z) {
		let cx = x.pos[0]*g+0.5 // todo: do pixel alignment in the shape constructor instead of offsetting everything
		let cy = x.pos[1]*g
		let xml = ""
		if (x.type=='box') {
			xml += `<path class="box" d="M${-x.size[0]/2*g},${-x.size[1]/2*g} h${x.size[0]*g} v${x.size[1]*g} h${-x.size[0]*g} z"/>`
		} else if (x.type=='cloud') {
			xml += `<path class="box" d="M${(-x.size[0]/2+1)*g},${(-x.size[1]/2+2)*g}`
			xml += `a ${g},${g} 0 11 ${g},${-g}`
			for (let i=0; i<x.size[0]/2-2; i++)
				xml += `a ${g},${g} 0 01 ${g*2},${0}`
			xml += `a ${g},${g} 0 11 ${g},${g}`
			for (let i=0; i<x.size[1]/2-2; i++)
				xml += `a ${g},${g} 0 01 ${0},${g*2}`
			xml += `a ${g},${g} 0 11 ${-g},${g}`
			for (let i=0; i<x.size[0]/2-2; i++)
				xml += `a ${g},${g} 0 01 ${-g*2},${0}`
			xml += `a ${g},${g} 0 11 ${-g},${-g}`
			for (let i=0; i<x.size[1]/2-2; i++)
				xml += `a ${g},${g} 0 01 ${0},${-g*2}`
			xml += `z"/>`
		} else if (x.type=='arrow1') {
			xml += `<path class="box" d="M${(-x.size[0]/2)*g},${(0)*g}`
			xml += `h${x.size[0]*g} v${(x.size[1]-1)*g} l${(-x.size[0]/2)*g},${g} l${(-x.size[0]/2)*g},${-g}`
			xml += `z"/>`
		} else if (x.type=='merge1') {
			// todo: allow this to be 3d with a thickness parameter  make a shared projection function to map z to x,y
			xml += `<path class="box" d="M${-x.size[0]/2*g},${-x.size[1]/2*g} h${x.size[0]*g} l${-g*2},${x.size[1]*g} h${-(x.size[0]-4)*g} z"/>`
		} else if (x.type=='oval') {
			xml += `<path class="box" d="M${-x.size[0]/2*g},${0} a ${x.size[0]/2*g},${x.size[1]/2*g} 0 01 ${x.size[0]*g},${0} a ${x.size[0]/2*g},${x.size[1]/2*g} 0 01 ${-x.size[0]*g},${0} z"/>`
		} else if (x.type=='arrow2') {
			xml += `<path class="box" d="M${(0)*g},${(-x.size[1]/2)*g}`
			xml += `h${x.size[0]*g} v${(x.size[1]-1)*g} h${x.size[0]*g}`
			xml += `z"/>`
		}
		for (let i=x.slice ? x.slice.n-1 : 0; i>=0; i--) {
			let z1 = z + i*(x.slice ? x.slice.d : 0)
			p2depth(10 - z1, `<g ${tt(cx+px(z1),cy+py(z1))} ${i!=0 && x.thickness ? "class='solid'" : ""}>${xml}</g>`)
		}
		if (x.type=='merge1' && x.thickness) {
			// back edge
			let xml = `<path class="backbox" d="M${x.size[0]/2*g},${-x.size[1]/2*g} l${-g*2},${x.size[1]*g} h${-(x.size[0]-4)*g}"/>`
			let z1 = z + x.thickness
			p2depth(10 - z1, `<g ${tt(cx+px(z1),cy+py(z1))}>${xml}</g>`)
			{
				let xml = `<path class="wirebox" d="M${x.size[0]/2*g},${-x.size[1]/2*g}l${px(x.thickness)},${py(x.thickness)} M${(-x.size[0]/2+2)*g},${(x.size[1]/2)*g} l${px(x.thickness)},${py(x.thickness)} M${(x.size[0]/2-2)*g},${x.size[1]/2*g} l${px(x.thickness)},${py(x.thickness)}"/>`
				p2depth(10 - z, `<g ${tt(cx+px(z),cy+py(z))}>${xml}</g>`)
			}
		}
	}
	function makelabel(parent, l) {
		let pos = {px:0,py:0,ax:0,ay:0}
		if (/n/.test(l.pos)) pos.py = -1
		if (/s/.test(l.pos)) pos.py = 1
		if (/w/.test(l.pos)) pos.px = -1
		if (/e/.test(l.pos)) pos.px = 1
		if (/o/.test(l.pos)) {
			pos.ax = pos.px
			pos.ay = pos.py
		} else {
			pos.ax = -pos.px
			pos.ay = -pos.py
		}
		let dx = 0
		let dy = 0
		if (parent.slice) {
			let d = (parent.slice.n-1)*(parent.slice.d)
			if (pos.px>0 && pos.ax>0) {
				dx += px(d)
			} else if (pos.py>0 && pos.ay>0) {
				dy += py(d)
			}
		}
		let xml = "<text"
		if (parent.type=='arrow1')
			xml += tt((pos.px*parent.size[0]/2*g)+pos.ax*margin+dx,((pos.py*parent.size[1]-3)*g)+pos.ay*margin+dy)
		else
			xml += tt((pos.px*parent.size[0]/2*g)+pos.ax*margin+dx,(pos.py*parent.size[1]/2*g)+pos.ay*margin+dy)
		xml += ` text-anchor="${["end","middle","start"][pos.ax+1]}"`
		xml += ` dominant-baseline="${["auto","central","hanging"][pos.ay+1]}"`
		xml += `>`
		let lines = l.text.split("\n")
		for (let i=0; i<lines.length; i++) {
			xml += `<tspan x="0" y="${i - (lines.length-1)/2}em">${lines[i]}</tspan>`
		}
		xml += `</text>`
		return xml
	}
	let xml = `<style>
.box {
fill: white;
stroke: black;
stroke-width: 1;
}
.solid .box {
 fill: gray;
stroke: gray;
}
.wirebox {
fill: none;
stroke: black;
stroke-width: 1;
}
.backbox {
fill: gray;
stroke: black;
stroke-width: 1;
}
tspan:not([dominant-baseline]) { dominant-baseline: inherit; } /* safari... */
</style>`
	let g = 6
	let depths = {} // smaller index = deeper into screen
	function p2depth(d, xml) {
		depths[d] ||= []
		depths[d].push(xml)
	}
	for (let x of def) {
		let cx = x.pos[0]*g+0.5 // todo: do pixel alignment in the shape constructor instead of offsetting everything
		let cy = x.pos[1]*g+0.5
		let thickness = x.slice ? (x.slice.n-1)*(x.slice.d) : 0
		let zz = (x.pos[2] || 0)-thickness/2
		makeshape(x, zz)
		for (let l of x.labels) {
			let z = zz
			p2depth(15, `<g ${tt(cx+px(z),cy+py(z))}>${makelabel(x, l)}</g>`)
		}
	}
	for (let x of Object.keys(depths).sort((a,b)=>a-b)) {
		xml += depths[x].join("")
	}
	$out.innerHTML = xml
</script>
