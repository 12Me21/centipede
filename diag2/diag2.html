<!doctype html>
<meta charset=utf-8>

<svg id=$out viewBox="0 0 300 200" width=300 height=200>
	
</svg>

<script>
	let def = [
		{
			type: 'box',
			pos: [6, 6],
			size: [5, 5],
			labels: [
				{pos:"c", text:"layer-specific\nrendering"},
			],
		}
	]
	let margin = 2
	function makelabel(parent, l) {
		let pos = {px:0,py:0,ax:0,ay:0}
		if (/n/.test(l.pos)) pos.py = -1
		if (/s/.test(l.pos)) pos.py = 1
		if (/w/.test(l.pos)) pos.px = -1
		if (/e/.test(l.pos)) pos.px = 1
		if (/o/.test(l.pos)) {
			pos.ax = pos.px
			pos.ay = pos.py
		} else {
			pos.ax = -pos.px
			pos.ay = -pos.py
		}
		let xml = "<text"
		xml += ` x="${(pos.px*parent.size[0]/2*g)+pos.ax*margin}"`
		xml += ` y="${(pos.py*parent.size[1]/2*g)+pos.ay*margin}"`
		xml += ` text-anchor="${["end","middle","start"][pos.ax+1]}"`
		xml += ` dominant-baseline="${["auto","central","hanging"][pos.ay+1]}"`
		xml += `>`
		let lines = l.text.split("\n")
		for (let i=0; i<lines.length; i++) {
			xml += `<tspan x="0" y="${i - (lines.length-1)/2}em">${lines[i]}</tspan>`
		}
		xml += `</text>`
		return xml
	}
	let xml = `<style>
.box {
fill: white;
stroke: black;
stroke-width: 1;
}
</style>`
	let g = 12
	for (let x of def) {
		xml += `<g transform="matrix(1,0,0,1,${x.pos[0]*g+0.5},${x.pos[1]*g+0.5})">`
		xml += `<path d="M${-x.size[0]/2*g},${-x.size[1]/2*g} h${x.size[0]*g} v${x.size[1]*g} h${-x.size[0]*g} z" class="box"/>`
		for (let l of x.labels) {
			xml += makelabel(x, l)
		}
		xml += `</g>`
	}
	$out.innerHTML = xml
</script>
