<!doctype html>
<meta charset=utf-8>

<svg id=$out viewBox="0 0 300 200" width=300 height=200>
	
</svg>

<script>
	let def = [
		{
			type: 'box',
			pos: [6, 6],
			size: [5, 5],
			labels: [
				{pos:"c", text:"c"},
				{pos:"n", text:"n"},
				{pos:"ne", text:"ne"},
				{pos:"e", text:"e"},
				{pos:"se", text:"se"},
				{pos:"s", text:"s"},
				{pos:"sw", text:"sw"},
				{pos:"w", text:"w"},
				{pos:"nw", text:"nw"},
				{pos:"on", text:"on"},
				{pos:"one", text:"one"},
				{pos:"oe", text:"oe"},
				{pos:"ose", text:"ose"},
				{pos:"os", text:"os"},
				{pos:"osw", text:"osw"},
				{pos:"ow", text:"ow"},
				{pos:"onw", text:"onw"},
			],
		}
	]
	let margin = 2
	function makelabel(parent, l) {
		let pos = {px:0,py:0,ax:0,ay:0}
		if (/n/.test(l.pos)) pos.py = -1
		if (/s/.test(l.pos)) pos.py = 1
		if (/w/.test(l.pos)) pos.px = -1
		if (/e/.test(l.pos)) pos.px = 1
		if (/o/.test(l.pos)) {
			pos.ax = pos.px
			pos.ay = pos.py
		} else {
			pos.ax = -pos.px
			pos.ay = -pos.py
		}
		let attr = ""
		attr += ` x="${(pos.px*parent.size[0]/2*g)+pos.ax*margin}"`
		attr += ` y="${(pos.py*parent.size[1]/2*g)+pos.ay*margin}"`
		attr += ` text-anchor="${["end","middle","start"][pos.ax+1]}"`
		attr += ` dominant-baseline="${["auto","central","hanging"][pos.ay+1]}"`
		return `<text ${attr}>${l.text}</text>`
	}
	let xml = `<style>
.box {
fill: white;
stroke: black;
stroke-width: 1;
}
</style>`
	let g = 12
	for (let x of def) {
		xml += `<g transform="matrix(1,0,0,1,${x.pos[0]*g+0.5},${x.pos[1]*g+0.5})">`
		xml += `<path d="M${-x.size[0]/2*g},${-x.size[1]/2*g} h${x.size[0]*g} v${x.size[1]*g} h${-x.size[0]*g} z" class="box"/>`
		for (let l of x.labels) {
			xml += makelabel(x, l)
		}
		xml += `</g>`
	}
	$out.innerHTML = xml
</script>
